<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Lumislides : un projecteur (point doré) dont le faisceau éclaire une diapositive, sur le bleu nuit du thème Nuit -->
  <defs>
    <linearGradient id="ls-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28354f"/>
      <stop offset="1" stop-color="#0f141e"/>
    </linearGradient>
    <linearGradient id="ls-beam" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff0b8" stop-opacity=".62"/>
      <stop offset="1" stop-color="#fff0b8" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="ls-slide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff1cf"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#ls-bg)"/>
  <path d="M21 21 L85 38 L85 75 L27 75 Z" fill="url(#ls-beam)"/>
  <rect x="29" y="40" width="53" height="32" rx="5" fill="url(#ls-slide)"/>
  <rect x="36" y="48" width="23" height="4.5" rx="2.25" fill="#28354f"/>
  <rect x="36" y="56.5" width="34" height="3.2" rx="1.6" fill="#8d97ab"/>
  <rect x="36" y="62.5" width="27" height="3.2" rx="1.6" fill="#8d97ab"/>
  <circle cx="21" cy="21" r="6.5" fill="#ffd463"/>
  <circle cx="21" cy="21" r="11" fill="#ffd463" opacity=".18"/>
</svg>
